<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nika Med — Медицинские профосмотры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script>
// Прототип доступен только с ПК: телефоны получают заглушку.
(function () {
  var isPhone = /Android.+Mobile|iPhone|iPod|Windows Phone|Mobile/i.test(navigator.userAgent)
    || window.matchMedia('(max-width: 767px)').matches;
  if (isPhone) {
    document.body.innerHTML = '<div class="desktop-only">Прототип можно посмотреть только с ПК</div>';
    return;
  }
  ['data.js', 'app.js'].forEach(function (src) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false;
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
