<text x="60" y="260" font-size="15">Жалобы: не предъявляет.</text><text x="60" y="284" font-size="15">Анамнез: АД периодически до 135/85 мм рт. ст., гипотензивные не принимает.</text><text x="60" y="308" font-size="15">Объективно: состояние удовлетворительное. Тоны сердца ясные, ритмичные.</text><text x="60" y="332" font-size="15">АД 128/82 мм рт. ст., ЧСС 70 уд/мин.</text><text x="60" y="356" font-size="15">ЭКГ: синусовый ритм, без патологических изменений.</text><text x="60" y="380" font-size="15"></text><text x="60" y="404" font-size="15">Диагноз: Z00.0 — общий медицинский осмотр, патологии не выявлено.</text><text x="60" y="428" font-size="15">Рекомендации: контроль АД, повторный осмотр через 12 месяцев.</text><text x="60" y="452" font-size="15"></text><text x="60" y="476" font-size="15">Медицинских противопоказаний к работе не выявлено.</text>
